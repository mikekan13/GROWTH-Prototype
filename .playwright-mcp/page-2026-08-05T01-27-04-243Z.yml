        - generic [ref=f12e814]:
          - generic [ref=f12e815]: "→ update_location(location=Violet's Apartment — Fourth Floor Walkup, description=A pre-war urban studio on the fourth floor of a five-story walkup. Reconstructed from memory and want. Autumn, ~4:00 PM. Single main room with galley kitchen alcove and small bathroom — 420–460 sq ft of accumulated life, nothing matching, everything earned., environment=Pre-war urban building, fourth floor walkup, street-facing, autumn afternoon, spec={\"structure\":\"Pre-war urban studio apartment, fourth floor of a five-story walkup. Footprint approximately 420–460 sq ft (39–43 m²), single main room with galley kitchen alcove and small bathroom. Ceiling height 9.5 ft (2.9 m) — tall for the square footage. One exposed steam pipe runs floor-to-ceiling in the far corner, painted over many times, paint slightly cracked at the joints. Layout from entry: door opens into the main room at the rear-left corner; galley kitchen alcove immediately to the right of the entry, running along the right wall (~8 ft deep, 5 ft wide); main living/working space occupies the center and front; large window on the front wall (street-facing), fire escape beyond it; bathroom door on the left wall, two-thirds of the way toward the window.\",\"surfaces\":\"Walls: eggshell — not white, not gray, the in-between color of rooms nobody chose to paint. Slight sheen under direct light, matte in shadow. Hairline crack radiating from the upper-left corner of the window frame. Ghost rectangles where previous tenants' frames hung. One scuff at chair-height near the desk. Ceiling: same eggshell, slightly yellowed near the kitchen alcove. One original plaster medallion (painted over) around a bare-bulb fixture with a paper globe shade, dented on one side. Floor: dark-stained oak plank, heavily aged, boards 3.5 in wide running front-to-back. Scarred and honest — visible gaps (2–4 mm) between boards with collected dust and a stray bobby pin. Scratches radiating from the desk chair's range of motion. A pale water ring near the couch. Two cream-colored candle-wax droplets fused near the bathroom door. Creaks — specifically a two-note creak on the path between the couch and the bathroom, worn subtly lighter along that walking line. No rugs.\",\"focalPoint\":\"The oversized double-hung sash window on the front wall, and the fire escape beyond it. The window is the room's lung — the source of all meaningful light, the point where inside and outside negotiate. Late-autumn ~4 PM sun enters at a low angle, throwing a parallelogram of amber across the floor that reaches the foot of the desk. The fire escape is Violet's outdoor room: a folded blanket on the grating, a ceramic mug (cold), a small pot of herbs going dormant for winter. The window's old glass bends light faintly. The lower sash does not close fully — a permanent half-inch gap admits street sound and cold air at the sill.\",\"lighting\":{\"primary\":\"Late-autumn ~4:00 PM sun through the front sash window — low angle, amber, entering as a wide beam that throws a parallelogram across the dark oak floor and catches the foot of the desk.\",\"secondarySources\":[\"Bare-bulb fixture with dented paper globe shade at ceiling center — off, present\",\"Desk lamp: adjustable-arm, matte black, 40W warm bulb — on, pooling over the desk surface\",\"Laptop screen glow: cool white-blue, low, secondary wash across the desk zone\",\"Bathroom warm-white bulb over mirror — off, door half-open, thin warm strip visible at threshold\"],\"behavior\":\"The sunbeam is the room's dominant fact — it moves slowly rightward across the floor as the afternoon dies. Dust motes visible in the beam. The desk lamp creates a competing warm island. The laptop screen adds a cool underlight. The rest of the room sits in cool, desaturated ambient shadow. The kitchen alcove is dim, lit only by bounce off the eggshell walls.\",\"colorTemperature\":\"Sunbeam: ~2700–3000K amber; desk lamp: ~2800K warm; laptop: ~6000K cool-blue; ambient shadow: ~4500K desaturated\",\"effect\":\"The room exists in two temperatures at once — warm amber island at the desk and window, cool shadow everywhere else. The sunbeam makes the scarred floor beautiful for exactly one hour.\"},\"zones\":[{\"name\":\"Entry / Kitchen Alcove\",\"description\":\"The door opens at the rear-left corner into the main room. Immediately right: the galley kitchen alcove, ~8 ft deep × 5 ft wide. Narrow counter runs the right wall — scratched laminate surface, white once, now the color of old teeth. Under-counter fridge, humming slightly off-pitch. Two-burner electric stove, one burner ring slightly askew. Open shelving above: mismatched mugs (four, no two alike), a stack of bowls, a jar of pasta, a jar of lentils. The dish drying rack holds two plates and a single mug — the dishes that waited a week, now done. A dish towel hangs from the oven handle, faded red stripe. The ceiling yellows slightly here from old cooking heat.\"},{\"name\":\"Desk / Work Zone\",\"description\":\"Right-center of the main room, angled slightly toward the window to catch natural light. The desk is a solid-core door on two mismatched sawhorses — one metal, one wooden — the whole thing shimmed level with a folded matchbook under the wooden sawhorse's left foot. Surface: controlled chaos with a system only Violet understands. Open laptop (screen on, a document or browser tab). A ceramic mug of cold coffee, ring-stained at the base. Pens in a jam jar, most working, one definitely dead. A stack of books used as a monitor riser. Loose papers — some blank, some covered in handwriting (small, left-leaning). A folded receipt. Sticky notes on the desk edge. The desk chair has left a starburst of scratches in the floor around its range of motion. The corkboard is mounted on the wall above the desk: layers of pinned items — cards, a printed photo (faces unclear), a torn page of handwriting, a bus schedule, a postcard, a small drawing. One empty pushpin. One thing is missing from this board and the room does not say what.\"},{\"name\":\"Couch / Living Zone\",\"description\":\"Left side of the main room, against the left wall, facing the window obliquely. The couch is deep forest green velvet, overstuffed, slightly faded on the sun-facing arm. Accumulated: a rust herringbone wool blanket in a specific heap (slept-under, not decorative), two throw pillows mismatched in size and fabric, a paperback face-down on the middle cushion (spine cracked, page held by pressure alone — a bad habit). A pale water ring on the floor at the couch's near leg. The couch is the room's secondary world — the desk is where work happens; the couch is where everything else does.\"},{\"name\":\"Window & Fire Escape\",\"description\":\"The front wall. Oversized double-hung sash window, wood frame painted eggshell, paint peeling on the exterior sill. Old glass — faint waviness that bends the street below. Lower sash does not close fully: permanent half-inch gap, a folded index card wedged in as a draft block (partially effective). The fire escape beyond is Violet's outdoor room: a folded blanket on the grating, a ceramic mug gone cold, a small terracotta pot of herbs going dormant. The black iron grating carries rust at the bolt-points. Street sounds enter here continuously.\"},{\"name\":\"Bookshelf Zone\",\"description\":\"Against the wall near the couch — a narrow five-shelf unit, leaning 2–3 degrees from true vertical, shimmed at the base with a folded magazine. Books fill it beyond capacity: double-stacked in places, horizontals laid across verticals, paperbacks with covers half-peeled, cracked spines, dog-eared corners, a receipt used as a bookmark protruding from one. No book looks new. Every spine is broken in a different place. A few non-book objects colonize the shelves: a small candle stub, a coin, something that might be a key.\"},{\"name\":\"Laundry / Bathroom Threshold\",\"description\":\"A wicker basket near the bathroom door holds clean, folded laundry — the folds are neat, precise, cared-for. One clean towel hangs over the bathroom door. In a room where the dishes waited a week and the desk is controlled chaos, the laundry is always done. It is the single system that never failed — the proof someone lives here rather than survives here. Two candle-wax droplets (cream-colored) are fused into the floor planks just outside the bathroom door.\"}],\"environmentalSystems\":\"Street sound bleeds continuously through the window gap — traffic hiss, distant sirens, a dog somewhere. The radiator ticks; the steam pipe in the far corner occasionally knocks. The air near the window is cooler than the rest of the room. The sunbeam moves slowly rightward across the floor as the afternoon progresses. Dust motes are visible in the beam. Nothing in this room was purchased as a set — furniture is accumulated, not coordinated. Wear is specific and narrative: the ink stain on the desk is work, the worn floor path between couch and bathroom is habit, the matchbook shim under the sawhorse is making-do.\",\"sensory\":{\"scent\":\"Cold coffee, ink, the ghost of vanilla candle, and underneath it all — clean laundry.\",\"sound\":\"Constant low street bleed through the window gap: traffic hiss, distant sirens, a dog somewhere. Radiator ticks. Steam pipe knocks occasionally. At midnight (not now): bad trumpet from the unit above.\",\"temperature\":\"The radiator ticks but the window gap wins at the sill. The sunbeam is warm enough to nap in. The room runs two temperatures: amber warmth at the window and desk, cool ambient everywhere else.\"},\"palette\":[{\"element\":\"Walls\",\"hex\":\"#E8E2D5\",\"note\":\"Eggshell in-between — not white, not gray\"},{\"element\":\"Floor\",\"hex\":\"#4A3728\",\"note\":\"Dark scarred oak\"},{\"element\":\"Couch\",\"hex\":\"#2E4A3B\",\"note\":\"Deep forest green velvet\"},{\"element\":\"Blanket (rust)\",\"hex\":\"#B5651D\",\"note\":\"Rust herringbone wool\"},{\"element\":\"Blanket (cream stripe)\",\"hex\":\"#EFE6D8\",\"note\":\"Herringbone cream\"},{\"element\":\"Sunbeam\",\"hex\":\"#F5B942\",\"note\":\"Dying autumn amber\"},{\"element\":\"Shadow ambient\",\"hex\":\"#8C8A85\",\"note\":\"Cool desaturated\"},{\"element\":\"Fire escape\",\"hex\":\"#1F1F1F\",\"note\":\"Aged black iron\"},{\"element\":\"Fire escape rust\",\"hex\":\"#7A3B1E\",\"note\":\"Rust at bolt-points\"},{\"element\":\"Laptop glow\",\"hex\":\"#D6E4F0\",\"note\":\"Cool white-blue screen wash\"}],\"generation\":{\"heroComposition\":\"From the entry door looking toward the window — the sunbeam, desk, and bulletin board read as the hero composition; the couch anchors the left third.\",\"timeLock\":\"Locked to late-autumn ~4:00 PM. The sunbeam is present and moving. Do not render as morning or evening.\",\"constraints\":[\"Nothing matches. Furniture is accumulated, not purchased as a set. Suppress any instinct toward coordinated decor.\",\"Wear is specific, not procedural. Damage tells stories — ink stain = work, worn floor path = habit, matchbook shim = making-do.\",\"One empty pushpin on the corkboard is mandatory.\",\"No book looks new. Every spine is broken in a different place.\",\"No rugs anywhere in the main room.\"],\"openQuestion\":\"One empty pushpin on the corkboard. Something was there. The room does not say what.\"}})"
