          - generic [ref=f12e967]: → place_item(name=Ceramic Mug (Desk), type=misc, location=cmsbkj79l004xlg48hc46n8q5, description=A ceramic mug, white with a faint blue ring at the rim — the kind sold four-to-a-set, this being the last survivor. Cold coffee inside, ring-stained at the base from weeks of the same habit. Sits at the right edge of the sawhorse desk, within reach of the chair but never in the way of the laptop. The ring stain beneath it is a permanent fixture of the laminate, darker than the surrounding surface., tags=["desk","mug","cold-coffee","Violet"])
          - generic [ref=f12e968]: "→ establish_world_facts(facts=[{\"subjectKey\":\"main-room.floor\",\"fact\":\"Dark-stained oak plank, 3.5 in wide, running front-to-back. Heavily aged — gaps of 2–4 mm between boards collect dust and a stray bobby pin. Scratches radiate from the desk chair's range of motion. A pale water ring near the couch's near leg. Two cream candle-wax droplets fused into the planks just outside the bathroom door. A two-note creak on the path between the couch and bathroom, that line worn subtly lighter than the surrounding wood. No rugs anywhere.\"},{\"subjectKey\":\"main-room.walls\",\"fact\":\"Eggshell — not white, not gray, the in-between color of rooms nobody chose to paint. Slight sheen under direct light, matte in shadow. Hairline crack radiating from the upper-left corner of the window frame. Ghost rectangles where previous tenants' frames hung. One scuff at chair-height near the desk.\"},{\"subjectKey\":\"main-room.ceiling\",\"fact\":\"Eggshell, slightly yellowed near the kitchen alcove. One original plaster medallion (painted over) around the central bare-bulb fixture, which has a dented paper globe shade. Fixture is currently off.\"},{\"subjectKey\":\"main-room.steam-pipe\",\"fact\":\"Exposed steam pipe runs floor-to-ceiling in the far right corner, painted over many times. Paint is slightly cracked at the joints. Knocks occasionally. Ticks when the heat cycles.\"},{\"subjectKey\":\"main-room.window\",\"fact\":\"Oversized double-hung sash window on the front wall. Wood frame painted eggshell, paint peeling on the exterior sill. Old glass — faint waviness bends the street below. Lower sash does not close fully: permanent half-inch gap, a folded index card wedged in as draft block (partially effective). The sunbeam enters here at a low angle (~4 PM, late autumn), throwing a parallelogram of amber across the floor that reaches the foot of the desk. The sunbeam moves slowly rightward as the afternoon dies.\"},{\"subjectKey\":\"main-room.window.index-card\",\"fact\":\"A folded index card wedged into the gap between the lower sash and the sill — a draft block that is only partially effective. Cold air still bleeds through at the sill.\"},{\"subjectKey\":\"main-room.fire-escape\",\"fact\":\"Beyond the window. Aged black iron grating with rust at the bolt-points. Violet's outdoor room: a folded blanket on the grating, a ceramic mug gone cold, a small terracotta pot of herbs going dormant for winter. Street sounds enter through the window gap continuously.\"},{\"subjectKey\":\"main-room.desk\",\"fact\":\"A solid-core door laid across two mismatched sawhorses — one metal, one wooden. The whole assembly is shimmed level with a folded matchbook under the wooden sawhorse's left foot. Surface is controlled chaos with a system only Violet understands. Angled slightly toward the window to catch natural light.\"},{\"subjectKey\":\"main-room.desk.laptop\",\"fact\":\"Open, screen on — a document or browser tab. The screen casts a cool white-blue wash (~6000K) across the desk surface, competing with the warm desk lamp. The laptop is the desk's center of gravity.\"},{\"subjectKey\":\"main-room.desk.mug\",\"fact\":\"White ceramic mug, last of a set, cold coffee inside, ring-stained at the base. Sits at the right edge of the desk within reach of the chair. The ring stain beneath it is permanent.\"},{\"subjectKey\":\"main-room.desk.pens\",\"fact\":\"A jam jar holding pens — most working, one definitely dead. The dead one has not been thrown away.\"},{\"subjectKey\":\"main-room.desk.papers\",\"fact\":\"Loose papers on the desk surface — some blank, some covered in small left-leaning handwriting. A folded receipt. Sticky notes on the desk edge. A stack of books used as a monitor riser.\"},{\"subjectKey\":\"main-room.desk.matchbook\",\"fact\":\"A folded matchbook shim under the wooden sawhorse's left foot, keeping the desk level. It has been there long enough to compress flat.\"},{\"subjectKey\":\"main-room.corkboard\",\"fact\":\"Mounted on the wall above the desk. Layered with pinned items: cards, a printed photo (faces unclear), a torn page of handwriting, a bus schedule, a postcard, a small drawing. One empty pushpin. Something was there and is no longer. The board is the room's nervous system.\"},{\"subjectKey\":\"main-room.couch\",\"fact\":\"Deep forest green velvet, overstuffed, slightly faded on the sun-facing arm. Against the left wall, facing the window obliquely. Two mismatched throw pillows. The rust herringbone wool blanket is in a specific heap — slept-under, not decorative. A pale water ring on the floor at the near leg.\"},{\"subjectKey\":\"main-room.couch.paperback\",\"fact\":\"A paperback face-down on the middle cushion. Spine cracked, page held by pressure alone — a bad habit. The cover is face-down; the title is not immediately visible.\"},{\"subjectKey\":\"main-room.bookshelf\",\"fact\":\"Narrow five-shelf unit near the couch, leaning 2–3 degrees from vertical, shimmed at the base with a folded magazine. Books fill it beyond capacity: double-stacked in places, horizontals laid across verticals. Paperbacks with covers half-peeled, cracked spines, dog-eared corners, a receipt protruding as a bookmark. No book looks new. Every spine is broken in a different place. A small candle stub, a coin, and something that might be a key colonize the shelves among the books.\"},{\"subjectKey\":\"main-room.laundry-basket\",\"fact\":\"Wicker basket near the bathroom door. Clean, folded laundry inside — the folds are neat, precise, cared-for. In a room where the dishes waited a week and the desk is chaos, the laundry is always done.\"},{\"subjectKey\":\"main-room.floor-lamp\",\"fact\":\"Standing near the couch zone. Off at 4 PM — the sunbeam and desk lamp are enough. Its presence is noted; its light is not currently needed.\"},{\"subjectKey\":\"main-room.exterior-door\",\"fact\":\"At the rear-left corner of the room. Apartment keys hang on or near it. The door is the boundary between Violet's world and the building's stairwell.\"},{\"subjectKey\":\"main-room.bobby-pin\",\"fact\":\"A single bobby pin lodged in a gap between floor planks, near the desk zone. It has been there long enough to be furniture.\"},{\"subjectKey\":\"main-room.ambient\",\"fact\":\"Street sound bleeds continuously through the window gap — traffic hiss, distant sirens, a dog somewhere. The radiator ticks. The steam pipe knocks occasionally. Dust motes are visible in the sunbeam. The air near the window is cooler than the rest of the room. Scent: cold coffee, ink, ghost of vanilla candle, clean laundry underneath.\"}])"
          - generic [ref=f12e969]: "→ establish_world_facts(facts=[{\"subjectKey\":\"bathroom.door\",\"fact\":\"On the left wall of the main room, two-thirds of the way toward the window. Currently half-open. A clean towel hangs over the door on the main-room side. Two cream candle-wax droplets are fused into the floor planks just outside the threshold.\"},{\"subjectKey\":\"bathroom.floor\",\"fact\":\"Small white hex tile, a few tiles cracked. Grout gray with age — the room's age record. The tile is cold underfoot. A thin warm strip of light from the main room falls across it through the half-open door.\"},{\"subjectKey\":\"bathroom.walls\",\"fact\":\"White or near-white, aged. Clean but old. The grout is the dominant texture.\"},{\"subjectKey\":\"bathroom.lighting\",\"fact\":\"Warm-white bulb over the mirror is currently off. The room is lit only by ambient bleed from the main room through the half-open door. The mirror is dark, reflecting nothing useful. The candle stub on the shelf is unlit.\"},{\"subjectKey\":\"bathroom.mirror\",\"fact\":\"Above the pedestal sink. Warm-white bulb fixture mounted above it, currently off. The mirror reflects a dim, cool version of the bathroom — the half-open door, the hex tile, the shelf. Nothing useful at this light level.\"},{\"subjectKey\":\"bathroom.sink\",\"fact\":\"Pedestal sink. The toothpaste tube is rolled from the bottom — the single small discipline in an apartment that runs on controlled chaos. The tube is not new.\"},{\"subjectKey\":\"bathroom.toothpaste\",\"fact\":\"Rolled from the bottom, a habit of discipline. Sits on or beside the pedestal sink. Not new — rolled tight, near the end.\"},{\"subjectKey\":\"bathroom.tub\",\"fact\":\"Clawfoot-style or aged alcove tub — the specific type is the room's ambiguity. Used, not decorative. A wire caddy sits across the rim holding shampoo, soap, and whatever is in current use.\"},{\"subjectKey\":\"bathroom.tub.caddy\",\"fact\":\"Wire caddy across the tub rim. Holds shampoo (bottle not full), a bar of soap, and at least one other item in current use. The wire is slightly rusted at the contact points.\"},{\"subjectKey\":\"bathroom.shelf\",\"fact\":\"Wooden shelf at eye level on one wall. Holds: a face-down paperback (spine cracked, page held by pressure alone — same habit as the couch copy), a stub of candle burned low, and a water glass (clean). The shelf is the bathroom's only personality.\"},{\"subjectKey\":\"bathroom.shelf.paperback\",\"fact\":\"Face-down, spine cracked, page held by pressure alone. The same habit as the paperback on the couch in the main room. Two face-down paperbacks in one apartment. The room does not explain this.\"},{\"subjectKey\":\"bathroom.shelf.candle\",\"fact\":\"A stub of candle, burned low, cream-colored wax. Unlit. Has been burned before — the wax is pooled and re-solidified at the base. The ghost of vanilla scent clings to it.\"},{\"subjectKey\":\"bathroom.shelf.water-glass\",\"fact\":\"A water glass, clean. Sits on the wooden shelf. Used for drinking water in the night or morning. Clean means it was rinsed.\"},{\"subjectKey\":\"bathroom.ambient\",\"fact\":\"The bathroom is the apartment's one silent room — street sound does not reach here. Pipes tick in the wall occasionally. Scent: soap, faint damp, ghost of the candle stub. Cleaner than the rest of the apartment. Slightly cooler — no radiator, tile floor cold underfoot. The room reads as between uses: not abandoned, just paused.\"}])"
          - generic [ref=f12e970]: "→ establish_world_facts(facts=[{\"subjectKey\":\"kitchen.counter\",\"fact\":\"Scratched laminate running the right wall of the alcove. White once, now the color of old teeth. The surface holds the dish drying rack, and whatever is in current use. The scratches are a record of years of cutting and sliding.\"},{\"subjectKey\":\"kitchen.stove\",\"fact\":\"Two-burner electric stove. One burner ring is slightly askew — has been this way long enough that Violet works around it without noticing. The stove is functional, not loved.\"},{\"subjectKey\":\"kitchen.fridge\",\"fact\":\"Under-counter refrigerator, humming slightly off-pitch. The hum is a constant low presence in the alcove — a sound that becomes furniture. The pitch is wrong enough to notice the first time and never again.\"},{\"subjectKey\":\"kitchen.dish-rack\",\"fact\":\"Sits on the counter. Holds two plates and a single mug — the dishes that waited a week, now done. They are clean but not gleaming. The rack itself is slightly rusted at the wire joints.\"},{\"subjectKey\":\"kitchen.dish-towel\",\"fact\":\"Hangs from the oven handle. Faded — once had a red stripe, now more of a rust suggestion. Used, not decorative. Slightly damp from recent use.\"},{\"subjectKey\":\"kitchen.shelving\",\"fact\":\"Open shelving above the counter. Four mismatched mugs — no two alike. A stack of bowls. A jar of pasta (partially full). A jar of lentils (nearly full). Nothing decorative. Everything here is here because it is used.\"},{\"subjectKey\":\"kitchen.shelving.mugs\",\"fact\":\"Four mugs, no two alike. One is ceramic with a chipped handle. One is a tall travel mug without its lid. One has a faded logo, mostly illegible. One is a small espresso cup used for everything except espresso. None of them match.\"},{\"subjectKey\":\"kitchen.sink\",\"fact\":\"Stainless steel sink. Clean. The dish soap is beside it — the bottle squeezed from the sides, not the bottom. The faucet has a slow drip that Violet has stopped hearing.\"},{\"subjectKey\":\"kitchen.window\",\"fact\":\"A window in the kitchen alcove — smaller than the main room window, facing a different angle. Lets in diffuse light but no direct sun at 4 PM. The sill is narrow; nothing sits on it.\"},{\"subjectKey\":\"kitchen.ceiling\",\"fact\":\"Same eggshell as the main room but noticeably yellowed from old cooking heat. The yellowing is the room's record of every meal ever made here.\"},{\"subjectKey\":\"kitchen.ambient\",\"fact\":\"The alcove is the dimmest zone in the apartment at 4 PM — no direct light, only bounce off the eggshell walls from the main room's sunbeam. Scent: old cooking, dish soap, faint coffee, ghost of something fried a few days ago. The fridge hum is the room's constant. Slightly cooler than the main room — no radiator reach, no sunbeam. The fridge adds a faint chill near the counter.\"}])"
