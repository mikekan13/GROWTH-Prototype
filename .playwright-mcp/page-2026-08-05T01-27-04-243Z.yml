          - generic [ref=f12e860]: → place_item(name=Low Wooden Table, location=Main Room, type=misc, description=Rectangular coffee table, solid pine stained walnut, sitting in front of the couch. Surface is bare — no coasters, no magazines. There's a faint white ring near the left corner, old, from something left wet a long time ago. The grain runs lengthwise and is visible through the thin finish. Legs are straight, slightly scuffed at the base from being nudged by feet., weightLevel=5)
          - generic [ref=f12e861]: "→ place_item(name=Refrigerator, location=Galley Kitchen Alcove, type=misc, description=Compact apartment refrigerator, white, east wall. The exterior is clean except for one small magnet — a plain black rectangle, no text or image, holding nothing. The door seal is intact. A faint mechanical hum comes from it at irregular intervals. Inside: a half-empty carton of oat milk, a container of leftover rice with the lid slightly ajar, two eggs, a jar of tahini with the lid not fully tightened. The freezer compartment above holds one ice tray, mostly full., weightLevel=8)"
          - generic [ref=f12e862]: → place_item(name=Floor Lamp, location=Main Room, type=misc, description=Tall arc floor lamp, matte black stem, off-white linen shade slightly yellowed at the top from heat over time. Stands beside the left end of the couch — the preferred-side end. The switch is a rotary on the cord, within arm's reach of someone seated. Currently off. The base is weighted cast iron; the cord runs along the baseboard to the outlet behind the couch., weightLevel=4)
          - generic [ref=f12e863]: → place_item(name=Kitchen Window, location=Galley Kitchen Alcove, type=misc, description=Single-hung window above the sink, aluminum frame painted over once in white that's now yellowing. Closed and latched. The glass is clean on the inside; the exterior pane has city grime in the corners. The sill is narrow — just wide enough for a small plant, but nothing is there. Afternoon light comes through it at a low angle and catches the faucet chrome., weightLevel=9)
          - generic [ref=f12e864]: → place_item(name=Living Room Window, location=Main Room, type=misc, description=Large south-facing window, double-hung, white aluminum frame. Closed. Curtains are open — two panels of sheer white linen pushed to either side, letting in the full afternoon light. The sill is deep enough to sit on. The glass has a slight waviness to it, older glazing. Street noise filters through faintly even when closed — a low ambient hum of the city four floors below., weightLevel=9)
          - generic [ref=f12e865]: → place_item(name=Throw Blanket, location=Main Room, type=misc, description=Loosely woven cotton throw in a faded terracotta — once a deeper rust, now softened from washing. Folded in thirds over the left armrest of the couch. The edges are slightly frayed. It smells faintly of fabric softener and something warmer underneath, like sleep., weightLevel=1)
          - generic [ref=f12e866]: "→ place_item(name=Exterior Door, location=Main Room, type=misc, description=Solid-core apartment door on the north wall, painted white over many previous coats — the frame edges show layers in cross-section where the paint has chipped. Closed and locked: a deadbolt and a knob lock, both engaged. A peephole at eye level. Behind the door on the inside, a single hook holds a set of keys. The door fits slightly tight in its frame; it takes a shoulder nudge to open from inside., weightLevel=9)"
          - generic [ref=f12e867]: → place_item(name=Apartment Keys, location=Main Room, type=misc, description=A small ring holding two keys — a deadbolt key and a building entry key — plus a small brass tag stamped with the apartment number, 4F. Hangs on the hook behind the exterior door. The ring itself is slightly bent from being dropped. No keychain decoration., weightLevel=0)
          - generic [ref=f12e868]: "→ place_item(name=Bathroom Mirror, location=Bathroom, type=misc, description=Rectangular medicine cabinet with a mirrored door, surface-mounted above the sink. The mirror face is clean. Inside: a tube of toothpaste (nearly used, rolled from the bottom), a toothbrush in a small cup, a stick of deodorant, a bottle of ibuprofen with a few tablets remaining, a half-used bar of soap still in its paper wrapper. The cabinet door doesn't stay open on its own — it drifts closed unless held., weightLevel=4)"
          - generic [ref=f12e869]: → place_item(name=Bathroom Sink, location=Bathroom, type=misc, description=Pedestal sink, white porcelain, below the medicine cabinet. The basin is clean. Two-handle faucet, chrome, the hot handle slightly stiffer than the cold. A thin bar of soap sits on the left rim of the basin in a small ceramic dish — the soap is worn to a thin oval. The drain stopper is the pop-up type; it's currently in the open position., weightLevel=8)
          - generic [ref=f12e870]: → place_item(name=Toilet, location=Bathroom, type=misc, description=Standard white porcelain toilet, beside the sink. Lid closed. The tank has a faint water line mark about two inches down from the top — mineral deposit from the building's water. A roll of toilet paper on a wall-mounted holder to the right; a spare roll sits on top of the tank. Clean., weightLevel=9)
          - generic [ref=f12e871]: "→ place_item(name=Shower/Tub, location=Bathroom, type=misc, description=Standard alcove tub with a showerhead, white enamel, opposite the sink. A tension rod holds a plain white shower curtain — the curtain is pushed to one end, dry. The tub floor has a small non-slip mat, clear rubber, slightly curled at one corner. On the tub ledge: a bottle of shampoo (about a third full), a bottle of conditioner (almost empty), and a razor with one blade remaining. The grout between the wall tiles is clean but darkened with age., weightLevel=9)"
          - generic [ref=f12e872]: → place_item(name=Bathroom Towel, location=Bathroom, type=misc, description=One bath towel hanging on a wall-mounted bar beside the tub — a medium grey, slightly faded from washing, folded once over the bar. A hand towel on a second smaller bar beside the sink, same grey. Both are dry and clean., weightLevel=1)
