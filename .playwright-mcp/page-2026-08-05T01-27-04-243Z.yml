          - generic [ref=f12e925]: → place_item(name=Sawhorse Desk, type=misc, location=cmsbkj79l004xlg48hc46n8q5, description=A solid-core interior door laid across two mismatched sawhorses — one metal, one wooden. The wooden sawhorse's left foot is shimmed level with a folded matchbook. The door surface is scratched laminate on one side, raw wood on the other; Violet chose the raw wood face-up. The whole construction is stable if you don't lean on the right corner. Positioned right-center of the main room, angled slightly toward the window to catch the afternoon light., tags=["desk","work-zone","furniture","Violet"], weightLevel=7)
          - generic [ref=f12e926]: "→ place_item(name=Corkboard, type=misc, location=cmsbkj79l004xlg48hc46n8q5, description=Mounted on the wall directly above the sawhorse desk. Standard 24×36 inch cork, wood frame, the cork surface dark with age and pin-holes. Layers of pinned items: a postcard (city skyline, no message visible on the face), a bus schedule with two stops circled in pen, a torn page of handwriting (small, left-leaning — the same hand as the loose papers on the desk), a printed photo (two figures, faces unclear at distance), a hand-drawn map or small drawing. One empty pushpin near the upper-right corner. Something was there. The board is the room's nervous system — the place where the inside of Violet's head becomes physical., tags=[\"corkboard\",\"work-zone\",\"Violet\",\"open-question\"], weightLevel=1)"
          - generic [ref=f12e927]: "→ place_item(name=Bookshelf, type=misc, location=cmsbkj79l004xlg48hc46n8q5, description=Narrow five-shelf particleboard unit against the wall near the couch, leaning 2–3 degrees from true vertical. Shimmed at the base with a folded magazine (a months-old issue, cover torn). Books fill it beyond capacity: double-stacked in places, horizontals laid across verticals to use every inch, paperbacks with covers half-peeled, cracked spines, dog-eared corners. No book looks new. Every spine is broken at a different point — some at the halfway mark, some near the end, one at the very first chapter. A small candle stub colonizes the second shelf. A coin (indeterminate denomination) on the third. Something that might be a key on the top shelf, behind a horizontal stack., tags=[\"bookshelf\",\"furniture\",\"Violet\",\"books\"], weightLevel=6)"
          - generic [ref=f12e928]: → place_item(name=Wicker Laundry Basket, type=misc, location=cmsbkj79l004xlg48hc46n8q5, description=Natural wicker, oval, sitting on the floor near the bathroom door. Contains clean, folded laundry — the folds are neat and precise, each item stacked with care. In a room where the dishes waited a week and the desk is controlled chaos, the laundry is always done. It is the single system that never failed. The basket itself shows wear at the rim where it's been gripped and carried; the interior is smooth from years of use., tags=["laundry","bathroom-threshold","Violet"], weightLevel=3)
          - generic [ref=f12e929]: → place_item(name=Desk Chair, type=misc, location=cmsbkj79l004xlg48hc46n8q5, description=A rolling office chair, aged — the seat cushion compressed flat from years of use, the fabric worn through at both armrests to the foam beneath. One wheel sticks slightly and needs a half-rotation of extra force to unstick. The chair's range of motion around the desk has left a starburst of scratches in the dark oak floor, the pattern radiating outward like a compass rose of habit. Currently pushed in under the sawhorse desk., tags=["desk","work-zone","furniture","Violet"], weightLevel=4)
          - generic [ref=f12e930]: → place_item(name=Paperback (Couch), type=misc, location=cmsbkj79l004xlg48hc46n8q5, description=A paperback novel, face-down on the middle cushion of the couch, spine cracked, page held by pressure alone — the bad habit of someone who doesn't use bookmarks. The cover is visible only if the book is turned over. The spine is broken at roughly two-thirds of the way through. It has been face-down long enough that the pages have taken a slight curve from the cushion's give., tags=["book","couch","Violet","open-question"], weightLevel=0)
          - generic [ref=f12e931]: → place_item(name=Desk Lamp, type=misc, location=cmsbkj79l004xlg48hc46n8q5, description=Adjustable-arm desk lamp, matte black, clamped to the right edge of the sawhorse desk. 40W warm bulb, currently on — pools a warm island of light across the desk surface. The arm is bent at a habitual angle, aimed at the space between the laptop and the paper stack. The clamp has left a small compression mark in the desk's raw wood edge., tags=["lamp","work-zone","lighting","Violet"], weightLevel=1)
          - generic [ref=f12e932]: → place_item(name=Laptop, type=tool, location=cmsbkj79l004xlg48hc46n8q5, description=A laptop computer, open, screen on — a document or browser tab visible, not readable at distance. Sitting on a stack of three or four books used as a monitor riser, which tilts it back at a comfortable viewing angle. The screen emits a cool white-blue wash, a secondary light source competing with the desk lamp's warmth. The keyboard has the faint shine of heavy use on the most-pressed keys. A sticker on the lid, partially peeled., tags=["laptop","work-zone","Violet"], weightLevel=2)
          - generic [ref=f12e933]: → place_item(name=Two-Burner Electric Stove, type=misc, location=cmsbkj7ag0050lg48njb2hmb8, description=A compact two-burner electric stove built into the counter run along the right wall of the galley alcove. White enamel, scratched and slightly discolored from heat. The left burner ring sits level; the right ring is slightly askew — it still works, but a pot on it will tilt a few degrees unless corrected. The drip pan beneath the right burner has a faint scorch ring from something that boiled over and was never fully cleaned. The oven handle below has a dish towel hanging from it., tags=["stove","kitchen","appliance","Violet"], weightLevel=8)
          - generic [ref=f12e934]: → place_item(name=Dish Drying Rack, type=misc, location=cmsbkj7ag0050lg48njb2hmb8, description=A wire dish drying rack sitting on the counter beside the sink. Currently holds two plates and a single mug — the dishes that waited a week, now washed and air-drying. The rack itself is older, the chrome finish worn to bare metal at the contact points. A rubber drip mat underneath, slightly curled at one corner. The dishes in it are clean but not gleaming — done out of necessity, not enthusiasm., tags=["dish-rack","kitchen","Violet"], weightLevel=2)
          - generic [ref=f12e935]: → place_item(name=Dish Towel, type=misc, location=cmsbkj7ag0050lg48njb2hmb8, description=A cotton dish towel hanging from the oven handle. Once had a bold red stripe down each side — now faded to a dusty rose from many washes. The fabric is soft with age, slightly frayed at one corner. Damp from recent use — the dishes were just done., tags=["kitchen","towel","Violet"], weightLevel=0)
          - generic [ref=f12e936]: "→ place_item(name=Kitchen Shelving (Mugs, Bowls, Jars), type=misc, location=cmsbkj7ag0050lg48njb2hmb8, description=Open wooden shelving above the counter, mounted to the right wall. Three shelves. Top shelf: four mismatched mugs — a white diner mug with a chip on the rim, a dark blue ceramic mug with no handle (replaced with a wrap of electrical tape), a tall travel mug missing its lid, and a short stout mug with a faded logo. Middle shelf: a stack of four bowls (two white, two off-white, none matching), a jar of dry pasta (penne, half-full), a jar of green lentils (three-quarters full). Bottom shelf: a cutting board leaning against the wall, a small bottle of dish soap, a box of salt. Nothing decorative. Everything here is here because it is used., tags=[\"shelving\",\"kitchen\",\"mugs\",\"Violet\"], weightLevel=4)"
          - generic [ref=f12e937]: "→ place_item(name=Wooden Bathroom Shelf, type=misc, location=cmsbkippi004vlg48p1hp3yd7, description=A narrow wooden shelf mounted at eye level on the wall beside the tub, opposite the sink. Painted white at some point, now yellowing and slightly peeling at the edges. Holds: a face-down paperback, a burned-low candle stub, and a water glass. The shelf bracket on the left side has pulled slightly from the wall — a single screw loose — giving it a barely perceptible tilt toward the tub., tags=[\"shelf\",\"bathroom\",\"Violet\"], weightLevel=1)"
          - generic [ref=f12e938]: → place_item(name=Paperback (Bathroom), type=misc, location=cmsbkippi004vlg48p1hp3yd7, description=A paperback novel, face-down on the wooden bathroom shelf, spine cracked — the same bad habit as the one on the couch in the main room. A different book. The spine is broken near the end, two-thirds to three-quarters through. The pages have taken on a slight humidity curl from the bathroom air. It has been here longer than the couch copy — the curl says so. Two books, two rooms, both face-down. She doesn't use bookmarks. She doesn't finish things in one place., tags=["book","bathroom","Violet","open-question"], weightLevel=0)
          - generic [ref=f12e939]: → place_item(name=Candle Stub (Bathroom), type=misc, location=Bathroom, description=A candle stub on the wooden bathroom shelf — cream wax, burned down to roughly an inch of height, the wick blackened and bent. Dried wax drips have fused it to the shelf surface; it would take effort to remove cleanly. Unlit. It has been used enough times to suggest a ritual — bath nights, probably — but not recently enough to suggest last night., tags=["candle","bathroom","Violet"], weightLevel=0)
          - generic [ref=f12e940]: → place_item(name=Water Glass (Bathroom), type=misc, location=Bathroom, description=A plain drinking glass on the wooden bathroom shelf, clean. Used for rinsing after brushing teeth. No decoration, no brand mark visible — one of those glasses that arrived without a story. A faint water line ring inside from the last fill, now dry., tags=["glass","bathroom","Violet"], weightLevel=0)
          - generic [ref=f12e941]: "→ place_item(name=Wire Tub Caddy, type=misc, location=Bathroom, description=A wire caddy spanning the rim of the tub, chrome finish mostly intact with rust beginning at the contact points where it rests on the porcelain. Holds: a bottle of shampoo (nearly empty, rolled from the bottom), a bar of soap in a small dish (worn smooth, a thumb-sized dent in the center from use), and a razor. The caddy is used, not decorative — it shifts slightly when the tub is filled because the tub rim isn't perfectly level., tags=[\"tub-caddy\",\"bathroom\",\"Violet\"], weightLevel=1)"
          - generic [ref=f12e942]: → place_item(name=Toothpaste, type=misc, location=Bathroom, description=A tube of toothpaste on the pedestal sink's edge, rolled from the bottom with precision — the single small discipline in this apartment. The roll is tight and even. Nearly at the cap; there is maybe a week left in it. A toothbrush leans against it, bristles slightly splayed from use., tags=["toothpaste","sink","bathroom","Violet"], weightLevel=0)
