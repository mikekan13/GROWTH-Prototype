                  - generic [ref=f20e129]: ENVIRONMENT
                  - generic [ref=f20e130]: "Urban, fourth floor, autumn afternoon. Street noise bleeds through a permanent half-inch gap in the lower window sash — traffic hiss, distant sirens, a dog somewhere. Radiator ticks. Air near the window is cooler than the rest of the room. The sunbeam is warm enough to nap in. Scent: cold coffee, ink, ghost of vanilla candle, clean laundry underneath it all. Color palette: eggshell walls (#E8E2D5), dark scarred oak floor (#4A3728), deep forest green couch (#2E4A3B), rust herringbone blanket (#B5651D / #EFE6D8), dying autumn amber sunbeam (#F5B942), cool desaturated shadow (#8C8A85)."
