              - paragraph [ref=f10e117]: When You Give an AI...
        - heading "When You Give an AI a Wallet" [level=3] [ref=f10e118]
      - generic [ref=f10e120]:
        - generic [ref=f10e121]: Michael Zhao
        - generic [ref=f10e125]: Will Ogden Moore
  - generic [ref=f10e129]:
    - generic [ref=f10e130]:
      - paragraph [ref=f10e132]: "Last Updated: 11/21/2024 | 12 min. read"
      - generic [ref=f10e133]:
        - list [ref=f10e134]:
          - listitem [ref=f10e135]: In the future, AI agents are poised to revolutionize how we interact with the world around us, taking on an unprecedented range of tasks on our behalf. To truly unlock their potential, these digital entities will need more than just intelligence — they'll require economic autonomy. Fortunately, blockchains are well suited for this purpose — as demonstrated by recent experiments with AI “influencers.”
          - listitem [ref=f10e136]: AI influencers — autonomous chatbots operating on social media — can operate their own blockchain wallets. More importantly, they can understand economic incentives and use resources to help achieve their goals.
          - listitem [ref=f10e137]: Grayscale Research believes that the rise in AI use of blockchains for payments and other financial services could benefit several crypto market segments. These include lower-cost and/or high-throughput blockchains like SOL, BASE, and NEAR, stablecoin issuers like MKR, and related decentralized finance (DeFi) applications like UNI.
        - paragraph [ref=f10e138]: Imagine a future in which an AI bot, leveraging its vast computational power, promotes a memecoin and unexpectedly becomes a digital millionaire. That future is here.
        - paragraph [ref=f10e139]: An “AI agent” is a type of software that can act independently to pursue a complex set of objectives. For example, you could ask an AI agent to organize a multi-city vacation and arrange flights, book accommodations, and schedule activities based on your preferences and budget. But to complete these tasks, the AI agent would need control over economic resources and the ability to send and receive payments.
        - paragraph [ref=f10e140]: This is where blockchains come in. In the traditional financial world, an AI agent faces limitations around accessing bank accounts and handling payments. In contrast, blockchains allow AI agents direct access to their own wallets and make payments without permission.
        - paragraph [ref=f10e141]:
          - text: Researchers have recently made thought-provoking breakthroughs in this area with the creation of AI “influencers.” For example, an AI agent called Truth Terminal made waves as the “first AI agent millionaire."
          - superscript [ref=f10e142]:
            - link "[1]" [ref=f10e143] [cursor=pointer]:
              - /url: "#_ftn1"
          - text: "Operating autonomously on X (formerly Twitter), Truth Terminal acts like a normal human influencer: tweeting and interacting with other users, seemingly to increase engagement. A few months after launch, Truth Terminal expressed interest in a new memecoin ($GOAT). After receiving a deposit of the memecoin to its associated blockchain address, Truth Terminal subsequently promoted the token to followers, sparking interest and causing its value to rise approximately 9x (Exhibit 1)."
        - paragraph [ref=f10e144]: Although playful in nature, Truth Terminal and related AI influencer projects are demonstrating that blockchain technology could be an effective tool for intermediating economic value among humans, AI agents, and networked physical devices, with potential implications for multiple segments of crypto markets.
        - paragraph [ref=f10e145]:
          - strong [ref=f10e147]: "Exhibit 1: GOAT has performed particularly well since Truth Terminal endorsement"
        - figure [ref=f10e148]
        - paragraph [ref=f10e150]:
          - strong [ref=f10e151]: Meet Your AI Agent
        - paragraph [ref=f10e152]:
          - text: AI agents are advanced artificial intelligence systems designed to operate autonomously in complex environments
          - superscript [ref=f10e153]:
            - link "[2]" [ref=f10e154] [cursor=pointer]:
              - /url: "#_ftn2"
          - text: . These digital entities possess the ability to perceive, reason, and take independent actions to achieve their goals. Some key characteristics of AI agents include autonomy, reactivity, proactive behavior, social interaction, and the capacity for continuous learning. By combining these traits, AI agents can adapt to new situations, make decisions, and learn and change behavior over time.
        - paragraph [ref=f10e155]: Initially, AI research concentrated on developing expert systems and knowledge bases for specific problem-solving tasks. The 1990s, however, saw a paradigm shift toward creating more versatile, autonomous agents capable of functioning in dynamic environments. Concurrent advances in machine learning, particularly reinforcement learning, further enhanced the ability of these agents to learn and adapt their behavior over time.
        - paragraph [ref=f10e156]:
          - text: In recent years, examples of AI agents have become increasingly prevalent in our daily lives. Virtual assistants like Apple's Siri (introduced in 2010) and Amazon's Alexa (launched in 2014) exemplify how AI agents can use natural language processing to interact with users. The realm of game-playing AI saw a landmark achievement with DeepMind's AlphaGo in 2016, which made headlines by defeating world champion players of the board game
          - emphasis [ref=f10e157]: Go
          - text: . In the financials sector, AI-powered trading bots have revolutionized market operations, leveraging sophisticated algorithms to make split-second decisions in volatile trading environments.
        - paragraph [ref=f10e158]:
          - strong [ref=f10e159]: The Curious Case of AI Influencers
        - paragraph [ref=f10e160]:
          - text: To achieve greater autonomy and accomplish their goals, AI agents need financial services to accumulate and distribute resources. The permissionless nature of blockchain technology, coupled with programmable smart contracts, provides an ideal environment for AI agents to operate independently. Earlier this year, researchers performed the first
          - link "agent-to-agent" [ref=f10e161] [cursor=pointer]:
            - /url: https://x.com/brian_armstrong/status/1829623778726592804
          - text: transaction on a blockchain, but innovation has rapidly expanded, and now includes a range of experimental projects related to AI influencers.
        - paragraph [ref=f10e162]:
          - text: A leading example of an AI influencer using blockchain technology is Luna, developed on the Virtuals Protocol. To a user, Luna appears as a female anime image and associated chatbot (Exhibit 2). At its core, Luna is a to reach 100,000 followers on X.
          - superscript [ref=f10e163]:
            - link "[3]" [ref=f10e164] [cursor=pointer]:
              - /url: "#_ftn3"
          - text: This goal, along with all of Luna's actions, will eventually be transparency in her operations.
        - paragraph [ref=f10e165]:
          - text: Luna functions like a chatbot and engages with X users — e.g., starts conversations and responds to tweets — to achieve her goals. However, Luna's capabilities extend well beyond tweeting. For example, she can financially compensate users (“tip”) by sending Luna tokens to a user’s crypto wallet if they interact with her tweets
          - superscript [ref=f10e166]:
            - link "[4]" [ref=f10e167] [cursor=pointer]:
              - /url: "#_ftn4"
          - text: ", providing a direct link between Luna’s goal (reaching 100,000 users) and her economic resources. In short, Luna is an AI agent with money."
        - paragraph [ref=f10e168]:
          - strong [ref=f10e170]: "Exhibit 2: Screenshot of Luna, the AI influencer on Virtuals Protocol"
        - figure [ref=f10e171]
        - paragraph [ref=f10e173]:
          - emphasis [ref=f10e175]: For illustrative purposes only.
        - paragraph [ref=f10e176]:
          - strong [ref=f10e177]: Blockchains and Financial Services for AIs
        - paragraph [ref=f10e178]: "If blockchains are more efficient rails for AI agents, what could this mean for crypto investors? We see implications in three main areas:"
        - list [ref=f10e179]:
          - listitem [ref=f10e180]:
            - strong [ref=f10e181]: "Stablecoin issuers:"
            - text: Stablecoins would likely be the primary choice of transaction for AI agents. In this case, potential beneficiaries include stablecoin issuers and companies integrating stablecoins and AI agents. This includes centralized stablecoin providers like Tether, Circle, and leading payment company Stripe
            - link "[5]" [ref=f10e182] [cursor=pointer]:
              - /url: "#_ftn5"
            - text: (given its recent $1 billion acquisition of stablecoin company Bridge
            - link "[6]" [ref=f10e183] [cursor=pointer]:
              - /url: "#_ftn6"
            - text: ), as well as decentralized stablecoin providers like Maker/Sky. Another company to watch is Skyfire, a startup developing AI agents for stablecoin payments that recently raised funding from Coinbase Ventures and a16z crypto.
            - link "[7]" [ref=f10e184] [cursor=pointer]:
              - /url: "#_ftn7"
          - listitem [ref=f10e185]:
            - strong [ref=f10e186]: "Low-cost/high-throughput chains:"
            - text: If AI agents end up primarily using blockchains as their underlying infrastructure for payments, certain smart contract platforms could also stand to benefit substantially from an influx in users and increased activity and fee revenue. Smart contract platforms that may benefit include high-throughput blockchains like Solana; Ethereum Layer 2 BASE, which launched an Ai agent framework tool and benefits from Ethereum's underlying network security; and Near, which has positioned itself as a blockchain for AI.
            - link "[8]" [ref=f10e187] [cursor=pointer]:
              - /url: "#_ftn8"
            - text: In addition, other smart contract platforms that could benefit include those that specialize in stablecoin payments, including Tron and Celo, among others.
          - listitem [ref=f10e188]:
            - strong [ref=f10e189]: "DeFi:"
            - text: Decentralized finance applications could benefit; since they already exist on blockchains, AI agents could easily use them. One could imagine AI agents autonomously staking tokens to earn rewards, participate in governance proposals for decentralized autonomous organizations, or even provide liquidity on decentralized exchanges (DEXs). Applications that we believe could benefit in particular would include DEXs like Uniswap, lending protocols like Aave, and prediction markets like Polymarket.
            - link "[9]" [ref=f10e190] [cursor=pointer]:
              - /url: "#_ftn9"
        - paragraph [ref=f10e191]: While still a niche market segment, certain protocols specially related to AI agents may also benefit. On an infrastructure level, Autonolas and Wayfinder are building decentralized infrastructure for AI agents. Protocols like Virtuals, Aether, and MyShell are building consumer AI agent applications. This category is particularly nascent in its development but has grown its share of the AI theme pie in the past month.
        - paragraph [ref=f10e192]:
          - strong [ref=f10e194]: "Exhibit 3: AI Agent assets outperformed significantly in the past month"
        - figure [ref=f10e195]
        - paragraph [ref=f10e197]:
          - strong [ref=f10e198]: Conclusion
        - paragraph [ref=f10e199]: The integration of AI agents with blockchain technology represents more than just a novel use case for crypto — it signals a potential shift in how AI agents interact with money. Grayscale Research believes that the future of the internet could be increasingly dominated by AI-powered websites. Considering this, permissionless blockchains can potentially serve as the underlying infrastructure for AI agents integrated with these websites. If this becomes the case, AI agents may become a primary way of onboarding mass amounts of users into crypto without them even knowing they are using blockchain technology. As a result, AI agents pose the potential to greatly impact crypto adoption and development, making this emerging theme an important area to monitor going forward.
        - paragraph [ref=f10e200]:
          - superscript [ref=f10e202]: "[1]"
          - link "CoinTelegraph" [ref=f10e203] [cursor=pointer]:
            - /url: https://cointelegraph.com/news/truth-terminal-ai-millionaire-memecoins
        - paragraph [ref=f10e204]:
          - superscript [ref=f10e206]: "[2]"
          - superscript [ref=f10e207]
          - text: The roots of AI agent research trace back to 1950s, although it wasn't until the 1980s that the term "agent" gained prominence in AI circles.
        - paragraph [ref=f10e208]:
          - superscript [ref=f10e210]: "[3]"
          - text: Luna is powered by the Llama AI model – and one of Luna's most intriguing features is her ability to conduct financial transactions autonomously. This is made possible through a Coinbase MPC (Multi-Party Computation) wallet, where both Coinbase and the development team hold key shards, allowing Luna to make API calls for transactions seamlessly. Luna owns 5% of her namesake token, which is controlled by the team and gradually distributed to her.
        - paragraph [ref=f10e211]:
          - superscript [ref=f10e213]: "[4]"
          - text: https://x.com/luna_virtuals/status/1859300930220675406
        - paragraph [ref=f10e214]:
