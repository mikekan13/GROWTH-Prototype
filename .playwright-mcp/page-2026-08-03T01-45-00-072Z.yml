              - generic [ref=f21e171]: "The center and front of the studio. Dark-stained oak plank floor (3.5 in boards, front-to-back), heavily scarred. Gaps between boards hold dust and a stray bobby pin. Scratches radiate from the desk chair's range. A pale water ring near the couch. Two cream candle-wax droplets fused near the bathroom door. A two-note creak on the path between couch and bathroom — the floor worn subtly lighter along that walking line. Walls eggshell (#E8E2D5), slight sheen under direct light, matte in shadow. Hairline crack radiating from upper-left corner of the window frame. Ghost rectangles where previous tenants' frames hung. One scuff at chair-height near the desk. Ceiling: same eggshell, one original plaster medallion (painted over) around a bare-bulb fixture with a paper globe shade, dented on one side. Exposed steam pipe in the far corner, floor-to-ceiling, painted over many times, paint slightly cracked at the joints."
