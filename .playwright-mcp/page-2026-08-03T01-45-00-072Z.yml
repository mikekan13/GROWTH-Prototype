              - generic [ref=f21e126]: "A pre-war studio on the fourth floor of a five-story walkup. ~440 sq ft, 9.5 ft ceilings. Single main room with galley kitchen alcove and small bathroom. Autumn, ~4:00 PM. The kind of room assembled from want and necessity over time — nothing matches, everything has a reason. Hero composition: from the entry door, the eye travels across scarred oak floor toward the large street-facing window, the sunbeam landing on the desk, the corkboard above it. The couch anchors the left third. One empty pushpin on the corkboard is the room's open question."
